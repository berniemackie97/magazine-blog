name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Type and content check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Production CMS integration
        run: npm run test:production
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Browser acceptance
        run: npm run test:browser
      - name: Browser reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-browser-reports
          path: |
            playwright-report
            test-results
          retention-days: 7
