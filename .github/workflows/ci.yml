name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Resolve editor dependencies
        run: |
          cp package-lock.json /tmp/rack-original-lock.json
          npm install --package-lock-only --ignore-scripts --legacy-peer-deps
          node -e 'const fs=require("fs");const a=JSON.parse(fs.readFileSync("/tmp/rack-original-lock.json"));const b=JSON.parse(fs.readFileSync("package-lock.json"));console.log("RACK_LOCK_UPDATE="+JSON.stringify({changed:Object.fromEntries(Object.entries(b.packages).filter(([k,v])=>JSON.stringify(a.packages[k])!==JSON.stringify(v))),removed:Object.keys(a.packages).filter(k=>!(k in b.packages))}))'
      - run: npm ci
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Type and content check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Production CMS integration
        run: npm run test:production
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Browser acceptance
        run: npm run test:browser
      - name: Browser reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-browser-reports
          path: |
            playwright-report
            test-results
          retention-days: 7
